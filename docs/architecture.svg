<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Counterfeit Medicine Checker: container diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Explicit background so it stays readable on GitHub's dark theme -->
  <rect width="1000" height="860" rx="16" fill="#ffffff"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#1f2937">Counterfeit Medicine Checker: container diagram</text>
  <text x="40" y="70" font-size="13.5" fill="#6b7280">C4 model, level 2. Supply-chain staff write through MetaMask. Patients only read, for free.</text>

  <!-- ========== People ========== -->
  <g text-anchor="middle" fill="#ffffff">
    <circle cx="260" cy="112" r="22" fill="#08427b"/>
    <rect x="120" y="132" width="280" height="80" rx="26" fill="#08427b"/>
    <text x="260" y="160" font-size="16" font-weight="700">Supply-chain staff</text>
    <text x="260" y="178" font-size="12" fill="#cfe0f3">[Person]</text>
    <text x="260" y="198" font-size="12.5">NMRA, manufacturer, distributor, pharmacy</text>

    <circle cx="740" cy="112" r="22" fill="#08427b"/>
    <rect x="600" y="132" width="280" height="80" rx="26" fill="#08427b"/>
    <text x="740" y="160" font-size="16" font-weight="700">Patient</text>
    <text x="740" y="178" font-size="12" fill="#cfe0f3">[Person]</text>
    <text x="740" y="198" font-size="12.5">Checks a pack with a phone, no wallet</text>
  </g>

  <!-- ========== System boundary ========== -->
  <rect x="320" y="244" width="360" height="530" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="334" y="764" font-size="13" font-weight="600" fill="#4b5563">Counterfeit Medicine Checker</text>
  <text x="334" y="764" dx="196" font-size="12" fill="#6b7280">[Software System]</text>

  <!-- ========== Containers ========== -->
  <g text-anchor="middle" fill="#ffffff">
    <rect x="340" y="272" width="320" height="100" rx="8" fill="#1168bd"/>
    <text x="500" y="302" font-size="16" font-weight="700">Web app</text>
    <text x="500" y="322" font-size="12" fill="#d6e6f7">[Container: Next.js 16, TypeScript · Vercel]</text>
    <text x="500" y="348" font-size="13">A page for each role and the patient verify page</text>

    <path d="M340,612 L340,716 A160,16 0 0 0 660,716 L660,612" fill="#1168bd"/>
    <ellipse cx="500" cy="612" rx="160" ry="16" fill="#3a86d4"/>
    <text x="500" y="656" font-size="16" font-weight="700">MedicineRegistry</text>
    <text x="500" y="676" font-size="12" fill="#d6e6f7">[Container: Solidity smart contract · Ethereum Sepolia]</text>
    <text x="500" y="702" font-size="13">Roles, batches, custody trail, hashed serials</text>
  </g>

  <!-- ========== External systems ========== -->
  <g text-anchor="middle" fill="#ffffff">
    <rect x="40" y="444" width="240" height="96" rx="8" fill="#8a8a8a"/>
    <text x="160" y="474" font-size="16" font-weight="700">MetaMask</text>
    <text x="160" y="494" font-size="12" fill="#eeeeee">[External system: browser wallet]</text>
    <text x="160" y="520" font-size="13">Signs staff transactions</text>

    <rect x="720" y="444" width="240" height="96" rx="8" fill="#8a8a8a"/>
    <text x="840" y="474" font-size="16" font-weight="700">RPC node</text>
    <text x="840" y="494" font-size="12" fill="#eeeeee">[External system: Alchemy]</text>
    <text x="840" y="520" font-size="13">Serves free reads of chain data</text>
  </g>

  <!-- ========== Relationships ========== -->
  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="300" y1="212" x2="420" y2="270"/>
    <line x1="700" y1="212" x2="580" y2="270"/>
    <line x1="370" y1="372" x2="230" y2="442"/>
    <line x1="630" y1="372" x2="770" y2="442"/>
    <line x1="170" y1="540" x2="350" y2="630"/>
    <line x1="830" y1="540" x2="650" y2="630"/>
  </g>

  <g font-size="13" fill="#374151">
    <text x="284" y="238" text-anchor="end">Runs the supply chain</text>
    <text x="284" y="254" text-anchor="end" font-size="11.5" fill="#6b7280">[HTTPS]</text>

    <text x="716" y="238">Scans a QR, checks a pack</text>
    <text x="716" y="254" font-size="11.5" fill="#6b7280">[HTTPS]</text>

    <text x="262" y="394" text-anchor="end">Asks for signatures</text>
    <text x="262" y="410" text-anchor="end" font-size="11.5" fill="#6b7280">[wagmi, viem]</text>

    <text x="738" y="394">Reads state and events</text>
    <text x="738" y="410" font-size="11.5" fill="#6b7280">[JSON-RPC]</text>

    <text x="250" y="604" text-anchor="end">Sends signed transactions</text>
    <text x="250" y="620" text-anchor="end" font-size="11.5" fill="#6b7280">[JSON-RPC]</text>

    <text x="750" y="604">eth_call, eth_getLogs</text>
    <text x="750" y="620" font-size="11.5" fill="#6b7280">[JSON-RPC]</text>
  </g>

  <!-- ========== Legend ========== -->
  <line x1="40" y1="798" x2="960" y2="798" stroke="#e5e7eb"/>
  <g font-size="12.5" fill="#374151">
    <text x="40" y="830" font-weight="700">Legend</text>
    <rect x="104" y="816" width="22" height="18" rx="6" fill="#08427b"/>
    <text x="134" y="830">Person</text>
    <rect x="204" y="816" width="22" height="18" rx="3" fill="#1168bd"/>
    <text x="234" y="830">Container (we build it)</text>
    <rect x="394" y="816" width="22" height="18" rx="3" fill="#8a8a8a"/>
    <text x="424" y="830">External system</text>
    <rect x="544" y="816" width="22" height="18" rx="3" fill="none" stroke="#6b7280" stroke-dasharray="4 3"/>
    <text x="574" y="830">System boundary</text>
    <line x1="694" y1="825" x2="730" y2="825" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="740" y="830">Relationship [technology]</text>
  </g>
</svg>
